name: Aura Capital CI

on:
  push:
    branches: [main, develop, "feat/**", "fix/**", "integration/**"]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Canonical Validation Pipeline
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: aura_capital_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aura_capital_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 4000
      HOST: localhost
      JWT_SECRET: ci-test-jwt-secret-with-at-least-32-characters-length
      AUTH_ACCESS_TOKEN_SECRET: ci-test-jwt-secret-with-at-least-32-characters-length
      AUTH_REFRESH_TOKEN_SECRET: ci-test-jwt-secret-with-at-least-32-characters-length
      AUTH_ACCESS_TOKEN_ISSUER: aura-capital
      AUTH_ACCESS_TOKEN_AUDIENCE: aura-client
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/aura_capital_test
      TEST_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/aura_capital_test
      REDIS_URL: redis://localhost:6379
      AUTH_RATE_LIMIT_ENABLED: "false"
      AUTH_RATE_LIMIT_KEY_SECRET: ci-test-rate-limit-key-secret-at-least-32-chars
      AUTH_TRUST_PROXY: "false"
      COMMUNITY_RATE_LIMIT_ENABLED: "true"
      COMMUNITY_RATE_LIMIT_KEY_SECRET: ci-test-community-rate-limit-secret-32ch
      CORS_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: 1. Clean Build Artifacts (npm run clean)
        run: npm run clean

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: 2. Prisma Schema Validation (prisma validate)
        run: npx prisma validate --schema=apps/api/prisma/schema.prisma

      - name: 3. Linting (npm run lint)
        run: npm run lint

      - name: 4. Typecheck (npm run typecheck)
        run: npm run typecheck

      - name: 5. Build (npm run build)
        run: npm run build

      - name: 6. Migration Governance Guard (npm run guard:migration)
        run: npm run guard:migration

      - name: Apply Database Migrations (Isolated Test Database)
        run: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma

      - name: Verify Database Migration Status
        run: npx prisma migrate status --schema=apps/api/prisma/schema.prisma

      - name: 7. Unit Test Suite (npm run test:unit)
        run: |
          set -o pipefail
          if ! npm run test:unit 2>&1 | tee unit-test.log; then
            {
              echo "### Unit Test Failures"
              echo '```text'
              cat unit-test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: 8. Standard Test Suites (npm run test)
        run: |
          set -o pipefail
          if ! npm run test 2>&1 | tee test.log; then
            {
              echo "### Standard Test Failures"
              echo '```text'
              cat test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: 9. PostgreSQL Database & Integration Tests (npm run test:db)
        run: |
          set -o pipefail
          if ! npm run test:db 2>&1 | tee db-test.log; then
            {
              echo "### PostgreSQL DB Test Failures"
              echo '```text'
              cat db-test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: 10. Dedicated FEAT-039 Security Abuse Suite
        run: |
          set -o pipefail
          if ! npm run test:security --workspace=@aura/api 2>&1 | tee security-test.log; then
            {
              echo "### FEAT-039 Security Abuse Test Failures"
              echo '```text'
              cat security-test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: 11. Redis Rate Limit Test Suite (npm run test:redis)
        env:
          AUTH_RATE_LIMIT_ENABLED: "true"
        run: |
          set -o pipefail
          if ! npm run test:redis 2>&1 | tee redis-test.log; then
            {
              echo "### Redis Test Failures"
              echo '```text'
              cat redis-test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: 12. Persistence Boundary Guard (npm run guard:persistence)
        run: |
          set -o pipefail
          if ! npm run guard:persistence 2>&1 | tee guard-persistence.log; then
            {
              echo "### Persistence Guard Failures"
              echo '```text'
              cat guard-persistence.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: 13. Repository Boundary Guard (npm run guard:boundary)
        run: |
          set -o pipefail
          if ! npm run guard:boundary 2>&1 | tee guard-boundary.log; then
            {
              echo "### Repository Boundary Guard Failures"
              echo '```text'
              cat guard-boundary.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: 14. Product Audit Governance Guard (npm run guard:audit-governance)
        run: |
          set -o pipefail
          if ! npm run guard:audit-governance 2>&1 | tee guard-audit.log; then
            {
              echo "### Product Audit Governance Guard Failures"
              echo '```text'
              cat guard-audit.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: 15. Seed Safety Guard (npm run guard:seed-safety)
        run: |
          set -o pipefail
          if ! npm run guard:seed-safety 2>&1 | tee guard-seed.log; then
            {
              echo "### Seed Safety Guard Failures"
              echo '```text'
              cat guard-seed.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
