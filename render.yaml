# Render Blueprint Specification (Solution B: Zero-Cost Cloud Orchestration)
# Aura Capital MVP — Production Infrastructure as Code
# Author: Antigravity (Solo Dev) — Phase 10 / FEAT-081

databases:
  - name: aura-capital-db
    databaseName: aura_capital_prod
    plan: free
    region: oregon
    ipAllowList: []

services:
  # ---------------------------------------------------------------------------
  # 1. Managed Redis (Session cache, transient state, rate-limiting)
  # ---------------------------------------------------------------------------
  - type: redis
    name: aura-capital-redis
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []

  # ---------------------------------------------------------------------------
  # 2. Backend Express API Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: aura-capital-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build --workspace=@aura/shared && npm run build --workspace=@aura/api && npx prisma generate --schema=apps/api/prisma/schema.prisma
    startCommand: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma && npm run seed:dev && npm run start --workspace=@aura/api
    healthCheckPath: /health/readiness
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: HOST
        value: 0.0.0.0

      # Database & Cache Bindings
      - key: DATABASE_URL
        fromDatabase:
          name: aura-capital-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: aura-capital-redis
          property: connectionString

      # High-Entropy Cryptographic Keys (Auto-Generated by Render)
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_ACCESS_TOKEN_SECRET
        generateValue: true
      - key: AUTH_REFRESH_TOKEN_SECRET
        generateValue: true
      - key: AUTH_RATE_LIMIT_KEY_SECRET
        generateValue: true
      - key: COMMUNITY_RATE_LIMIT_KEY_SECRET
        generateValue: true

      # Token Lifecycle & Security Configuration (ADR-004)
      - key: AUTH_ACCESS_TOKEN_TTL_MINUTES
        value: "15"
      - key: AUTH_ACCESS_TOKEN_ISSUER
        value: aura-capital
      - key: AUTH_ACCESS_TOKEN_AUDIENCE
        value: aura-client
      - key: AUTH_REFRESH_COOKIE_NAME
        value: aura_refresh_token
      - key: AUTH_REFRESH_COOKIE_SECURE
        value: "true"
      - key: AUTH_REFRESH_COOKIE_SAME_SITE
        value: none

      # Cross-Origin Resource Sharing (CORS)
      # Updated with Cloudflare Pages or Render Static Site URL
      - key: CORS_ORIGIN
        value: "https://aura-capital-web.onrender.com"

      # Feature Flags & Modes
      - key: SUBSCRIPTION_PROVIDER_MODE
        value: mock
      - key: DEV_SEED_USER_PASSWORD
        value: DevSeedPassword123!
      - key: GEMINI_API_KEY
        value: ""

  # ---------------------------------------------------------------------------
  # 3. Frontend React 19 SPA (Render Static Site Fallback / Direct Hosting)
  # ---------------------------------------------------------------------------
  - type: web
    name: aura-capital-web
    runtime: static
    buildCommand: npm ci --include=dev && npm run build --workspace=@aura/shared && npm run build --workspace=@aura/web
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "https://aura-capital-api.onrender.com"
